name: Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint the script and the workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 terminal-christmas-tree.sh

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt rhysd/actionlint:1.7.12 -color

  run:
    name: The tree draws, blinks, gives the terminal back, and the test can fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a pseudo-terminal: the tree at its full nineteen stars, the trunk,
      # next year in the greeting, still blinking at four seconds, and the
      # cursor visible again after Ctrl-C.
      - name: Run it headless
        run: ./tests/run-headless.sh

      # A test that cannot fail is not a test: each promise is broken on a
      # copy of the script, and the run fails if the test stays green.
      - name: The test, shown each violation it exists for
        run: python3 tests/plant-violations.py -- ./tests/run-headless.sh
